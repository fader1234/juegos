<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sala de juegos · Robert Fader</title>
  <meta name="description" content="Juegos con los personajes de las novelas de Robert Fader · Games · Giochi · Игры">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css">
  <script>
    // aplica el tema guardado antes de pintar para evitar parpadeos
    try { const th = localStorage.getItem("portal-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">
        <span class="brand-name" data-i18n="brand"></span>
        <span class="brand-by">Robert Fader</span>
      </a>
      <nav class="langs" id="langs" aria-label="Idioma / Language"></nav>
      <button class="theme-btn" id="themeBtn" data-i18n-aria="theme">☾</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="brand"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="stars-orn" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</div>
      <div class="pills" id="pills"></div>
    </section>

    <section class="pick" id="pick"></section>

    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p><a id="litLink" href="https://luisfader.github.io/litmir/" data-i18n="readNovels"></a></p>
      <p>© Robert Fader. <span data-i18n="rights"></span></p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/games.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <title>Ajedrez de las novelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/portal.css">
  <link rel="stylesheet" href="ajedrez.css">
</head>
<body>
  <div class="ambient" id="ambient"></div>

  <nav class="game-bar">
    <a href="../../" data-i18n="back"></a>
    <h1 data-i18n="title"></h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnSound" data-i18n-aria="sound">🔊</button>
    <button class="icon-btn" id="btnRivals" data-i18n-aria="rivals" hidden>👥</button>
    <span id="lang"></span>
  </nav>

  <!-- Pantalla 1: elegir rival -->
  <section class="screen" id="screenSelect">
    <header class="sel-head">
      <h2 data-i18n="pickRival"></h2>
      <p data-i18n="pickSub"></p>
    </header>
    <div class="rivals" id="rivalList"></div>
    <div class="options">
      <div class="opt">
        <span data-i18n="yourColor"></span>
        <div class="seg" id="colorSeg"></div>
      </div>
      <div class="opt">
        <span data-i18n="boardStyle"></span>
        <div class="themes" id="themeSeg"></div>
      </div>
    </div>
  </section>

  <!-- Pantalla 2: partida -->
  <section class="screen" id="screenGame" hidden>
    <div class="player-bar opp" id="oppBar">
      <img class="avatar" id="oppAvatar" alt="">
      <div class="pinfo">
        <div class="pname"><b id="oppName"></b> <span class="lvl" id="oppLevel"></span></div>
        <div class="captured" id="oppCaptured"></div>
      </div>
      <div class="status" id="oppStatus"></div>
      <div class="bubble" id="bubble" hidden></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces"></div>
      </div>
      <div class="promo" id="promo" hidden></div>
    </div>

    <div class="player-bar me">
      <div class="avatar me-av">♟</div>
      <div class="pinfo">
        <div class="pname"><b data-i18n="you"></b></div>
        <div class="captured" id="myCaptured"></div>
      </div>
      <div class="status" id="myStatus"></div>
    </div>

    <div class="moves" id="moves"></div>

    <div class="game-controls">
      <button class="btn" id="btnUndo">↶ <span data-i18n="undo"></span></button>
      <button class="btn" id="btnResign">🏳 <span id="resignLbl" data-i18n="resign"></span></button>
      <div class="themes mini" id="themeSeg2"></div>
    </div>
  </section>

  <div class="modal" id="modal" hidden><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>

  <script src="../../js/i18n.js"></script>
  <script src="strings.js"></script>
  <script src="pieces.js"></script>
  <script src="chess-engine.js"></script>
  <script src="ajedrez.js"></script>
</body>
</html>
